name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: pytest py${{ matrix.python }} wag${{ matrix.wagtail }} ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            wagtail: "7.0.*"
            template: basic
          - python: "3.11"
            wagtail: "7.1.*"
            template: basic
          - python: "3.12"
            wagtail: "7.1.*"
            template: basic
          - python: "3.13"
            wagtail: "7.*"
            template: basic
          - python: "3.13"
            wagtail: "7.*"
            template: pro

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64

      - name: "CR-QC: Install coderedcms from local repo"
        run: python -m pip install -r requirements-ci.txt wagtail==${{ matrix.wagtail }}

      - name: "CR-QC: Create starter project from template"
        run: coderedcms start testproject --template ${{ matrix.template }}

      - name: "CR-QC: Check migrations"
        run: |
          cd testproject
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install -r requirements.txt
          fi
          python manage.py makemigrations --check

      - name: "CR-QC: Run unit tests"
        run: pytest ./coderedcms/

  linters:
    name: Linters
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: "CR-QC: Install coderedcms from local repo"
        run: python -m pip install -r requirements-ci.txt

      - name: "CR-QC: Spelling"
        run: codespell ./coderedcms/ ./docs/

      - name: "CR-QC: Ruff Format"
        run: ruff format --check .

      - name: "CR-QC: Ruff Check"
        run: ruff check .

  docs:
    name: Documentation
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: "CR-QC: Install coderedcms from local repo"
        run: python -m pip install -r requirements-ci.txt

      - name: "CR-QC: Build documentation"
        run: sphinx-build -M html ./docs/ ./docs/_build -W
